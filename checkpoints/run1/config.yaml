model:
  pretrained: stable-diffusion-v1-5/stable-diffusion-v1-5
  control_scale: 1.0
data:
  processed_dir: datasets/coco256
  resolution: 256
  max_samples: -1
  val_samples: 8
  canny_low_range:
  - 50
  - 100
  canny_high_range:
  - 150
  - 250
  caption_dropout: 0.5
  num_workers: 4
  hflip: true
train:
  batch_size: 4
  grad_accum: 4
  learning_rate: 1.0e-05
  optimizer: adafactor
  weight_decay: 0.0
  ema_decay: 0.999
  adam_betas:
  - 0.9
  - 0.999
  adam_eps: 1.0e-08
  max_grad_norm: 1.0
  lr_warmup_steps: 500
  max_steps: 60000
  max_epochs: -1
  mixed_precision: fp16
  gradient_checkpointing: true
  unet_fp32: false
  seed: 42
logging:
  output_dir: checkpoints/run1
  log_every: 50
  ckpt_every: 2000
  keep_last: 3
  val_every: 2000
  val_steps: 20
  val_guidance: 7.5
sample:
  steps: 30
  guidance_scale: 9.0
  negative_prompt: lowres, bad anatomy, worst quality, blurry, jpeg artifacts
